# All knobs live here — no hardcoded values in code (loaded into frozen dataclasses).

models:
  # The two base-model candidates for the empirical probe (ADR-0001). The exact GGUF
  # source (repo + file) is resolved and recorded during the S1 probe (step 7); until
  # then it is null so a wrong guess is never silently baked in.
  # Matched Q8_0 quantization for both (fairness): Bielik ships no q4 GGUF, only fp16/Q8_0,
  # so the planned q4 (ADR-0001) is raised to Q8_0 for both candidates — resolved 2026-07-27.
  candidates:
    - key: qwen2.5-1.5b
      hf_repo: Qwen/Qwen2.5-1.5B-Instruct
      gguf_repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF
      gguf_file: qwen2.5-1.5b-instruct-q8_0.gguf
    - key: bielik-1.5b
      hf_repo: speakleash/Bielik-1.5B-v3.0-Instruct
      gguf_repo: speakleash/Bielik-1.5B-v3.0-Instruct-GGUF
      gguf_file: Bielik-1.5B-v3.0-Instruct.Q8_0.gguf

probe:
  dev_slice_size: 25       # a probe, not the dataset
  temperature: 0.0         # greedy — the only variable is the base model
  max_tokens: 1024
  few_shot_examples: 2
  context_tokens: 8192     # llama.cpp n_ctx
  shot_modes: [zero, few]

# theprotocol collection etiquette (mirrors it-job-radar; ADR-0002 leakage guard applied in code).
collection:
  sitemap_url: https://static.theprotocol.it/sitemaps/CurrentOffers/SiteMapJobOffers1.xml
  # Realistic browser UA — the site serves a stripped page to non-browser agents.
  user_agent: >-
    Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
    (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
  request_delay_s: 1.0     # throttle between offer fetches
  request_timeout_s: 25

# Pure scorer knobs (ADR-0003). Salary bounds scored within a tolerance band.
scoring:
  salary_rel_tolerance: 0.05   # ±5% on amount_from/amount_to
  # Uncertainty on a 142-record test set: a point estimate alone cannot say whether a gap between
  # two variants would survive a different sample of postings. Seeded, so the interval is
  # reproducible; resampling is by record, and every variant sees the same draw (paired).
  bootstrap_resamples: 2000
  bootstrap_seed: 20260728     # matches the labeling-QA sampling seed — one reproducibility knob
  bootstrap_ci: 95.0           # percentile band reported per variant and per paired difference

# S4 evaluation (ADR-0003): zero-/few-shot API baselines + the comparison report. The API
# baseline uses the SAME prompt as the probe (fairness — only the model differs) and is parsed
# on plain text, so JSON validity stays a first-class metric. Pricing is pulled at implementation
# time (per 1M tokens; Anthropic list price cached 2026-06-24), never hardcoded in code.
eval:
  api_model: claude-haiku-4-5      # cheap frontier baseline; the only variable vs the base/LoRA runs
  input_usd_per_mtok: 1.0          # claude-haiku-4-5 input price, USD / 1M tokens
  output_usd_per_mtok: 5.0         # claude-haiku-4-5 output price, USD / 1M tokens
  max_tokens: 1024                 # decoding cap (matches the probe)
  temperature: 0.0                 # greedy — decoding matched to the probe (only the model differs)
  few_shot_examples: 2             # shots drawn from the train head (matches probe/labeling-QA)
  shot_modes: [zero, few]          # the two API baselines
  request_max_snippets: 200        # hard egress cap: prose snippets sent per baseline run
  latency_percentiles: [50, 95]    # p50/p95 latency reported per variant (ADR-0003)

# Triangulated labeling-QA knobs (S3; ADR-0005). The proposer labels from prose at full scale;
# the arbiter is the strong-model first pass on the human-checked sample.
labeling_qa:
  proposer_backend: gguf         # gguf|api — seam kept, only gguf implemented (YAGNI); api fails fast
  proposer: bielik-1.5b          # must match a models.candidates[].key
  proposer_mode: few             # zero|few — the chosen base is few-shot (ADR-0001)
  arbiter: claude-opus-4-8       # API arbiter model id (ADR-0005); distinct from the proposer
  arbiter_max_snippets: 80       # hard egress cap: PII-free prose snippets sent to the arbiter
  human_sample_size: 72          # 60–80; the human-adjudicated gold sample
  sampling: stratified           # random|stratified (by LLM<->platform disagreement)
  sampling_seed: 20260728        # deterministic sample draw
  validated_f1: null             # soft flag surfaced in the report — NOT a pass/fail gate

# S5 QLoRA training method (ADR-0006). Colab-only trainer; every knob here, nothing hardcoded.
# The base is the probe winner (Bielik-1.5B); inference decoding matches eval.max_tokens for parity.
train:
  base: bielik-1.5b               # must match a models.candidates[].key (its hf_repo is trained)
  # LoRA over all linear layers, NF4 4-bit (ADR-0006)
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules: all-linear      # PEFT auto-discovers every nn.Linear except the head
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: fp16             # fp16 (free-Colab T4/P100 — no bf16) | bf16 (A100/L4); train+inference in sync
  # regime — short, over-regularized run against the 568-example overfit risk
  epochs: 3
  learning_rate: 0.0002
  lr_scheduler: cosine
  warmup_ratio: 0.05
  per_device_batch_size: 4
  grad_accum_steps: 4             # effective batch 16
  max_seq_len: 2048               # ESTIMATE — re-measure on Colab with the real Bielik tokenizer (~p99)
  dev_fraction: 0.1               # newest 10% of train -> inner temporal dev (checkpoint selection)
  seed: 20260728

data:
  sitemap_offers_sample: 800                  # target dataset size (S2); 314 in the old DB
  test_fraction: 0.2                          # temporal split: newest 20% -> test (ADR-0002)
  min_prose_chars: 200                        # drop offers with too little input text to learn from
  hf_dataset_repo: P0w3r223/pl-jobs-lora-dataset   # confirmed in S2; push deferred (needs HF token)

hf:
  adapter_repo: P0w3r223/pl-jobs-lora-adapter      # placeholder — confirmed in S5

tracking:
  experiment: pl-jobs-lora
  # Local file store by default; a hosted MLflow (DagsHub) is supplied at runtime via the
  # MLFLOW_TRACKING_URI env var so switching backends is config, not code (ADR-0004).
  tracking_uri: null
